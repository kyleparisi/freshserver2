- name: Install required system packages
  apt:
    name: "{{ packages }}"
    install_recommends: no
    update_cache: yes
  vars:
    packages:
      - ca-certificates
      - curl
      - python3-pip
      - virtualenv
      - python3-setuptools
      - amazon-ecr-credential-helper

- name: Create keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Determine dpkg architecture
  command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Add Docker Repository
  apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt and install docker-ce
  apt:
    update_cache: yes
    name: docker-ce

- name: Start docker
  service:
    name: docker
    state: started
    enabled: yes
  when: ansible_virtualization_type != "docker"

- name: Check whether the default image user exists
  getent:
    database: passwd
    key: "{{ docker_default_user }}"
  register: default_user_lookup
  failed_when: false

- name: Add users to docker group
  user:
    append: yes
    groups: docker
    user: "{{ item }}"
  loop: "{{ ([docker_default_user] if default_user_lookup.ansible_facts.getent_passwd is defined else []) + [github_user] }}"
